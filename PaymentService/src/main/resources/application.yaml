spring:
  application:
    name: PaymentService

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

razorpay:
  key-id: ${RAZORPAY_API_KEY}
  key-secret: ${RAZORPAY_KEY_SECRET}

server:
  port: 8085

jwt:
  public-key: ${JWT_PUBLIC_KEY}

services:
  product:
    url: ${PRODUCT_SERVICE_URL}
  order:
    url:  ${ORDER_SERVICE_URL:http://localhost:8082}