<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Razorpay Test Payment</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 80px auto;
            padding: 24px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Razorpay Test Payment</h2>

<p>
    Application Order ID:
    <strong>14</strong>
</p>

<p>
    Amount:
    <strong>₹3599</strong>
</p>

<button id="pay-button">Pay Now</button>

<div id="result"></div>


<script>

    const BACKEND_URL = "http://localhost:8085";

    // Your application's Order ID
    const ORDER_ID = 14;

    // Amount for this test
    const AMOUNT = 3599;


    document.getElementById("pay-button").onclick = async function () {

        const result = document.getElementById("result");

        result.textContent = "Creating Razorpay order...";

        try {

            // =====================================================
            // 1. CREATE RAZORPAY ORDER THROUGH YOUR BACKEND
            // =====================================================

            const createResponse = await fetch(
                `${BACKEND_URL}/payments/create/${ORDER_ID}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    // Your backend expects @RequestBody BigDecimal
                    body: JSON.stringify(AMOUNT)
                }
            );


            if (!createResponse.ok) {

                const errorText =
                    await createResponse.text();

                throw new Error(
                    `Order creation failed\n\n` +
                    `Status: ${createResponse.status}\n` +
                    errorText
                );
            }


            // =====================================================
            // 2. RECEIVE RESPONSE FROM YOUR PAYMENT SERVICE
            // =====================================================

            const payment =
                await createResponse.json();

            console.log(
                "PaymentService response:",
                payment
            );


            /*
                Your backend returns:

                {
                    "razorpayOrderId": "order_xxxxx",
                    "amount": 3599,
                    "currency": "INR",
                    "keyId": "rzp_test_xxxxx"
                }
            */


            result.textContent =
                "Razorpay order created.\n" +
                "Opening checkout...";


            // =====================================================
            // 3. CONFIGURE RAZORPAY CHECKOUT
            // =====================================================

            const options = {

                // Key ID returned by your backend
                key: payment.keyId,

                // Your backend returns rupees.
                // Razorpay Checkout expects paise.
                amount: payment.amount * 100,

                currency: payment.currency,

                name: "My E-Commerce",

                description: "Test Payment",

                // Razorpay-generated Order ID
                order_id: payment.razorpayOrderId,


                // =================================================
                // 4. PAYMENT SUCCESS
                // =================================================

                handler: async function (response) {

                    console.log(
                        "Razorpay response:",
                        response
                    );


                    result.textContent =
                        "Payment received.\n" +
                        "Verifying payment...";


                    // =============================================
                    // 5. SEND PAYMENT DETAILS TO YOUR BACKEND
                    // =============================================

                    const verifyResponse = await fetch(
                        `${BACKEND_URL}/payments/verify`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                razorpayOrderId:
                                response.razorpay_order_id,

                                razorpayPaymentId:
                                response.razorpay_payment_id,

                                razorpaySignature:
                                response.razorpay_signature
                            })
                        }
                    );


                    const verifyResult =
                        await verifyResponse.text();


                    console.log(
                        "Verification response:",
                        verifyResult
                    );


                    // =============================================
                    // 6. SHOW VERIFICATION RESULT
                    // =============================================

                    if (!verifyResponse.ok) {

                        result.textContent =
                            "Payment verification failed.\n\n" +
                            verifyResult;

                        return;
                    }


                    result.textContent =
                        "Payment successful and verified!\n\n" +
                        verifyResult;
                }
            };


            // =====================================================
            // 7. CREATE RAZORPAY CHECKOUT INSTANCE
            // =====================================================

            const razorpay =
                new Razorpay(options);


            // =====================================================
            // 8. PAYMENT FAILURE
            // =====================================================

            razorpay.on(
                "payment.failed",
                function (response) {

                    console.error(
                        "Payment failed:",
                        response.error
                    );


                    result.textContent =
                        "Payment failed:\n\n" +
                        JSON.stringify(
                            response.error,
                            null,
                            2
                        );
                }
            );


            // =====================================================
            // 9. OPEN RAZORPAY CHECKOUT
            // =====================================================

            razorpay.open();

        }

        catch (error) {

            console.error(error);

            result.textContent =
                "Error:\n\n" +
                error.message;
        }

    };

</script>

</body>
</html>
