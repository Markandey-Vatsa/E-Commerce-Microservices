server:
  port: 8087

spring:
  application:
    name: ChatBotService

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: ${GROQ_MODEL}
        replay-reasoning-content: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  public-key: ${JWT_PUBLIC_KEY}

services:
  product:
    url: ${PRODUCT_SERVICE_URL}