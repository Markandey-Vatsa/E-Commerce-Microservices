server:
  port: 8080

spring:
  application:
    name: APIGateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      server:
        webflux:
          routes:

            - id: authentication-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders/**

            - id: product-service
              uri: http://localhost:8083
              predicates:
                - Path=/products/**

            - id: delivery-service
              uri: http://localhost:8084
              predicates:
                - Path=/delivery/**

            - id: payment-service
              uri: http://localhost:8085
              predicates:
                - Path=/payments/**
