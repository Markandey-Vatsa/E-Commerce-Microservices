server:
  port: 8080

spring:
  application:
    name: APIGateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: authentication-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders/**

            - id: product-service
              uri: http://localhost:8083
              predicates:
                - Path=/products/**

#            - id: delivery-service
#              uri: http://localhost:8084
#              predicates:
#                - Path=/delivery/**
